[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exo-adapter-echo"
version = "0.1.0"
description = "Portable echo RuntimeAdapter for eXo-brain conformance and multi-adapter tests."
requires-python = ">=3.11"
dependencies = ["exo-brain-core-contracts"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
