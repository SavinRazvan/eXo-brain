# File: docker-compose.override.example.yml
# Path: docker-compose.override.example.yml
# Role: Example local-only Compose merge file (dev ergonomics).
# Used By:
#  - developers copying to docker-compose.override.yml
# Depends On:
#  - docker-compose.yml
# Notes:
#  - Rename/copy to `docker-compose.override.yml` in the same directory.
#    That filename is gitignored; Compose merges it with docker-compose.yml.
#  - Use this to set explicit CORS in dev instead of relying on development
#    wildcard behavior when EXO_CORS_ORIGINS is unset.

services:
  api:
    environment:
      # Example: explicit browser origins for local frontends (recommended).
      # EXO_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      # Optional: match production-like env without changing the base compose file.
      # EXO_ENV: staging
