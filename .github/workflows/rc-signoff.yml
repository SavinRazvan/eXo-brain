# File: rc-signoff.yml
# Path: .github/workflows/rc-signoff.yml
# Role: Enforces one-command release-candidate signoff on PRs to main.
# Used By:
#  - GitHub Actions
# Depends On:
#  - Makefile
#  - scripts/release/rc_signoff.py
#  - scripts/release/parse_rc_signoff.py
# Notes:
#  - Uploads `.local/rc-signoff.md` and `.local/rc-signoff.json` even when the gate fails.

name: rc-signoff

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "ui/**"
      - "Makefile"
      - ".github/workflows/**"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rc-signoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc_signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/dev/install_adapter_dependencies.sh

      - name: Run one-command release-candidate signoff
        run: make rc-signoff

      - name: Build normalized RC signoff JSON
        if: always()
        run: make rc-signoff-json

      - name: Upload RC signoff evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc-signoff-evidence
          path: |
            .local/rc-signoff.md
            .local/rc-signoff.json
          if-no-files-found: error
