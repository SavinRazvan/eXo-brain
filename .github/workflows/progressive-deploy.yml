# File: progressive-deploy.yml
# Path: .github/workflows/progressive-deploy.yml
# Role: Executes stage/prod deployment flow with health checks and rollback hook.
# Used By:
#  - GitHub Actions
# Depends On:
#  - scripts/release/rollback_release.py
#  - configs/release/rollout_policies.yaml
# Notes:
#  - Production deployment should use protected environment approvals.
#  - Real deploy/post-deploy automation is not wired here: only image build + local container smoke are executed.
#    Replace placeholder steps with kubectl/helm/terraform (or your CD system) before treating this as production deploy evidence.

name: progressive-deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        type: choice
        required: true
        options:
          - stage
          - prod
      release_ref:
        description: "Git ref/SHA to deploy"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image and smoke-test probes
        run: |
          set -euxo pipefail
          IMAGE_TAG="exo-brain:${{ github.sha }}"
          docker build -t "${IMAGE_TAG}" .
          docker run -d --name exo-smoke -p 18000:8000 "${IMAGE_TAG}"
          for _ in $(seq 1 40); do
            if curl -sf "http://127.0.0.1:18000/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:18000/health"
          curl -sf "http://127.0.0.1:18000/ready"
          docker stop exo-smoke

      - name: Deploy release (template placeholder — no external target invoked)
        run: |
          echo "Recording template-only deploy step for ${{ inputs.release_ref }} -> ${{ inputs.environment }}"
          mkdir -p artifacts/evidence
          echo "deploy_automation: template_placeholder_no_external_target" > artifacts/evidence/deploy.txt
          echo "environment: ${{ inputs.environment }}" >> artifacts/evidence/deploy.txt
          echo "release-ref: ${{ inputs.release_ref }}" >> artifacts/evidence/deploy.txt
          echo "container_image_smoke_local: passed" >> artifacts/evidence/deploy.txt

      - name: Post-deploy health (template placeholder — not hitting a live deployment)
        run: |
          echo "Post-deploy health automation not configured; no live deployment URL was probed."
          python -c "print('post_deploy_health_automation: not_invoked')"

      - name: Rollback on deploy failure
        if: failure()
        run: |
          python scripts/release/rollback_release.py \
            --release-ref "${{ inputs.release_ref }}" \
            --environment "${{ inputs.environment }}"

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: progressive-deploy-evidence-${{ inputs.environment }}-${{ github.run_id }}
          path: artifacts/evidence
