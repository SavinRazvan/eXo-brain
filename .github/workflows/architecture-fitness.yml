# File: architecture-fitness.yml
# Path: .github/workflows/architecture-fitness.yml
# Role: CI pipeline for architecture fitness and contract validation.
# Used By:
#  - GitHub Actions
# Depends On:
#  - scripts/architecture/validate_layers.py
#  - scripts/architecture/scan_forbidden_imports.py
#  - tests/modules/
# Notes:
#  - Keep this workflow aligned with active governance scripts and `.local/index-and-planning/current` coverage index output.
#  - evidence_bundle_publish records each job's GitHub Actions result (success|failure|skipped|cancelled) and fails the workflow if any stage did not succeed.
#  - automated_test_suite runs nbconvert --execute on notebooks/tutorial_08_governed_execution_sandbox.ipynb (OPENAI_API_KEY unset; Part 8 skips live calls).

name: architecture-fitness

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  COV_FAIL_UNDER: "95"
  EXO_ADAPTERS_PYPI_ONLY: "1"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "notebooks/**"
      - "requirements.txt"
      - "requirements-adapters.txt"
      - "Makefile"
      - ".github/workflows/**"
  push:
    branches: [main]

concurrency:
  group: architecture-fitness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate layer boundaries
        run: python scripts/architecture/validate_layers.py

  forbidden_import_scan:
    runs-on: ubuntu-latest
    needs: [architecture_lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan forbidden imports
        run: python scripts/architecture/scan_forbidden_imports.py

  governance_consistency:
    runs-on: ubuntu-latest
    needs: [forbidden_import_scan]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check governance consistency
        run: python scripts/architecture/check_governance_consistency.py

  automated_test_suite:
    runs-on: ubuntu-latest
    needs: [governance_consistency]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: bash scripts/dev/install_adapter_dependencies.sh
      - name: Run automated test suite
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=${{ env.COV_FAIL_UNDER }} -q
      - name: Execute tutorial 08 notebook (nbconvert; no live API)
        env:
          OPENAI_API_KEY: ""
        run: |
          python -m jupyter nbconvert --execute --ExecutePreprocessor.timeout=900 \
            --to notebook notebooks/tutorial_08_governed_execution_sandbox.ipynb \
            --output /tmp/tutorial_08_executed.ipynb
      - name: Build coverage JSON index input
        run: mkdir -p .local/generated-data/coverage .local/index-and-planning/current && coverage json -o .local/generated-data/coverage/coverage.json
      - name: Generate coverage index artifact
        run: python scripts/dev/generate_coverage_index.py --coverage-json .local/generated-data/coverage/coverage.json
      - name: Upload coverage index artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-index
          path: .local/index-and-planning/current/coverage-index.md

  contract_tests:
    runs-on: ubuntu-latest
    needs: [automated_test_suite]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: bash scripts/dev/install_adapter_dependencies.sh
      - name: Run runtime contract tests
        run: python -m pytest tests/modules/runtime/test_runtime_adapter_contract.py -q

  package_workspace_tests:
    runs-on: ubuntu-latest
    needs: [automated_test_suite]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: bash scripts/dev/install_adapter_dependencies.sh
      - name: Run packages/ workspace tests
        run: python -m pytest tests/packages -q

  integration_architecture_fitness:
    runs-on: ubuntu-latest
    needs: [contract_tests, package_workspace_tests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: bash scripts/dev/install_adapter_dependencies.sh
      - name: Run integration fitness tests
        run: python -m pytest tests/modules/core/test_orchestrator_turn.py tests/modules/core/test_multi_adapter_workflow_parity.py tests/modules/integration/test_host_adapter_input_flow.py -q

  evidence_bundle_publish:
    runs-on: ubuntu-latest
    needs:
      - architecture_lint
      - forbidden_import_scan
      - governance_consistency
      - automated_test_suite
      - contract_tests
      - package_workspace_tests
      - integration_architecture_fitness
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Build architecture evidence bundle
        run: |
          mkdir -p artifacts/evidence
          {
            echo "architecture_lint=${{ needs.architecture_lint.result }}"
            echo "forbidden_import_scan=${{ needs.forbidden_import_scan.result }}"
            echo "governance_consistency=${{ needs.governance_consistency.result }}"
            echo "automated_test_suite=${{ needs.automated_test_suite.result }}"
            echo "contract_tests=${{ needs.contract_tests.result }}"
            echo "package_workspace_tests=${{ needs.package_workspace_tests.result }}"
            echo "integration_architecture_fitness=${{ needs.integration_architecture_fitness.result }}"
          } > artifacts/evidence/architecture_fitness_summary.txt
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-fitness-evidence
          path: artifacts/evidence
      - name: Fail if any required stage did not succeed
        if: ${{ needs.architecture_lint.result != 'success' || needs.forbidden_import_scan.result != 'success' || needs.governance_consistency.result != 'success' || needs.automated_test_suite.result != 'success' || needs.contract_tests.result != 'success' || needs.package_workspace_tests.result != 'success' || needs.integration_architecture_fitness.result != 'success' }}
        run: |
          echo "::error::architecture-fitness evidence job: one or more upstream stages were not successful. See architecture_fitness_summary.txt in the uploaded artifact."
          exit 1
