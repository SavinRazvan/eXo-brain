# File: architecture-fitness.yml
# Path: .github/workflows/architecture-fitness.yml
# Role: CI pipeline for architecture fitness and contract validation.
# Used By:
#  - GitHub Actions
# Depends On:
#  - scripts/architecture/validate_layers.py
#  - scripts/architecture/scan_forbidden_imports.py
#  - tests/modules/
# Notes:
#  - Keep this workflow aligned with active governance scripts and control-center docs.

name: architecture-fitness

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/**"
  push:
    branches: [main]

concurrency:
  group: architecture-fitness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate layer boundaries
        run: python scripts/architecture/validate_layers.py

  forbidden_import_scan:
    runs-on: ubuntu-latest
    needs: [architecture_lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan forbidden imports
        run: python scripts/architecture/scan_forbidden_imports.py

  governance_consistency:
    runs-on: ubuntu-latest
    needs: [forbidden_import_scan]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check governance consistency
        run: python scripts/architecture/check_governance_consistency.py

  automated_test_suite:
    runs-on: ubuntu-latest
    needs: [governance_consistency]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run automated test suite
        run: python -m pytest -q

  contract_tests:
    runs-on: ubuntu-latest
    needs: [automated_test_suite]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run runtime contract tests
        run: python -m pytest tests/modules/runtime/test_runtime_adapter_contract.py -q

  integration_architecture_fitness:
    runs-on: ubuntu-latest
    needs: [contract_tests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run integration fitness tests
        run: python -m pytest tests/modules/core/test_orchestrator_turn.py tests/modules/core/test_multi_adapter_workflow_parity.py -q

  evidence_bundle_publish:
    runs-on: ubuntu-latest
    needs: [integration_architecture_fitness]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Build architecture evidence bundle
        run: |
          mkdir -p artifacts/evidence
          echo "architecture_lint=completed" > artifacts/evidence/architecture_fitness_summary.txt
          echo "forbidden_import_scan=completed" >> artifacts/evidence/architecture_fitness_summary.txt
          echo "contract_tests=completed" >> artifacts/evidence/architecture_fitness_summary.txt
          echo "integration_architecture_fitness=completed" >> artifacts/evidence/architecture_fitness_summary.txt
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: architecture-fitness-evidence
          path: artifacts/evidence
