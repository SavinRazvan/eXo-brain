name: ui-e2e-nonblocking

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run UI E2E smoke lane
        run: make ui-e2e-smoke

      - name: Upload UI E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-smoke-artifacts
          path: |
            .local/ui-e2e-smoke.json
            .local/ui-e2e-smoke.log
            .local/ui-smoke-runtime-snapshots.json
            .local/byoc-governance-metrics.json
          if-no-files-found: warn

