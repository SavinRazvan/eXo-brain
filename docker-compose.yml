# =============================================================================
# NOT A PRODUCTION / ENTERPRISE TEMPLATE
# =============================================================================
# Default service uses EXO_ENV=development. In that mode, unset EXO_CORS_ORIGINS
# may allow wildcard browser CORS — fine for local hacking, unsafe for prod.
#
# Before any production-like or shared deployment:
#   - Set EXO_ENV=production (or staging) and EXO_CORS_ORIGINS to real origins.
#   - Consider EXO_CONTROL_STATE_BACKEND=sqlite + EXO_CONTROL_STATE_SQLITE_DB_PATH
#     when multiple replicas need consistent run-control (see README table).
#   - Set secrets via env_file or orchestrator secrets — never commit real keys.
#
# Optional: copy docker-compose.override.example.yml → docker-compose.override.yml
# (gitignored) for machine-local ports, env, or volumes. Compose merges it
# automatically next to this file.
# =============================================================================
#
# File: docker-compose.yml
# Path: docker-compose.yml
# Role: Local single-node API + durable volume for SQLite and artifacts.
# Used By:
#  - developers / deployment certification smoke
# Depends On:
#  - Dockerfile
# Notes:
#  - See banner above — default stack is dev-oriented, not hardened prod.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      EXO_ENV: development
      # EXO_CONTROL_STATE_BACKEND: sqlite
      # EXO_CONTROL_STATE_SQLITE_DB_PATH: /app/.exo_data/exo_control_state.db
    volumes:
      - exo_data:/app/.exo_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  exo_data:
